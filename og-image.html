<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>og-image · vallartaweb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0a2540; }
    .og {
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(252, 204, 108, 0.08), transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(255, 107, 53, 0.12), transparent 55%),
        #0a2540;
      color: #f8f5ef;
      padding: 80px 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      font-family: 'Fraunces', Georgia, serif;
    }
    .og::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='1'/></svg>");
      opacity: 0.06;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    .top-row {
      display: flex; justify-content: space-between; align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px; letter-spacing: 0.32em;
      color: #fccc6c;
      text-transform: uppercase;
    }
    .top-row .dot { color: #ff6b35; }
    h1 {
      font-weight: 300;
      font-size: 120px;
      line-height: 0.95;
      letter-spacing: -0.035em;
      max-width: 18ch;
    }
    h1 em { font-style: italic; color: #fccc6c; font-weight: 300; }
    h1 .dot { color: #ff6b35; }
    .sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px; letter-spacing: 0.28em; text-transform: uppercase;
      color: rgba(248, 245, 239, 0.65);
    }
    .bottom-row {
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .brand {
      font-size: 48px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    .brand .dot { color: #ff6b35; }
    .punto-coral {
      width: 28px; height: 28px;
      background: #ff6b35;
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 14px;
      box-shadow: 0 0 60px 8px rgba(255, 107, 53, 0.4);
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="top-row">
      <span>VALLARTA <span class="dot">·</span> MÉXICO</span>
      <span>EST <span class="dot">·</span> 2026</span>
    </div>
    <div>
      <span class="punto-coral"></span>
      <h1>Sitios web<br>que venden mientras <em>duermes</em><span class="dot">.</span></h1>
    </div>
    <div class="bottom-row">
      <div class="brand">vallarta<span class="dot">.</span>web</div>
      <div class="sub">AGENCIA PREMIUM</div>
    </div>
  </div>
</body>
</html>
